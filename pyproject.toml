
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kdoctor"
version = "0.3.1"
description = "A lightweight CLI cluster health diagnostic tool for Kubernetes."
readme = "README.md"
authors = [
    { name = "Simon Wubshet" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "kubernetes>=28.0.0",
    "google-genai>=2.0.0,<3.0.0"
]

[project.scripts]
kdoctor = "kdoctor.cli:app"
